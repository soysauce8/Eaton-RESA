<!DOCTYPE html>

<html lang="en">
  <html lang="en">

  <head>
  <meta charset="utf-8">
  <title>position demo</title>
  <style>
  div{
    width:78px;
    height:150px;
    background-color: blue;
    border:2px solid blueviolet
  }
  #one{
    position:static;
  }
  #two{
    position:relative;
    left:60px;
    top:-50px;
    z-index:50;
  }
  #three{
    position:absolute;
    background-color: blueviolet;
    right:40px;
    top:60px;
    z-index:600;
  }
#Four{
  position:fixed;
  background-color: lightsalmon;
  right:0;
  bottom:200px;
}
#five{
  position:sticky;
  top:50px;
  background-color: blanchedalmond;

}

  </style>
  </head>
              
  <body>
    <div Id="one">

    </div>
    <div id="two">

    </div>
    <div id="three">

    </div>
    <div id="Four">
    </div>
    <div id="five">
    </div>
  <p></p>
  </body>
  
  </html>
