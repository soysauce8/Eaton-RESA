<!DOCTYPE html>

<html lang="en">
  <html lang="en">
    <head>
      <meta charset="utf-8" />
      <title>links</title>
      <style>
       a {
          color: rgb(25, 138, 101);
          font-weight:900;
          text-decoration:none;
          display:block;
          border:1px solid red;
          width:150px;
          padding: 10px;
          margin-bottom: 30px;
          margin-left:auto;
          margin-right:auto;
        }
       a.two {
          color: rgb(85, 31, 192);
          font-weight:90;
          text-decoration:none;
          display:block;
          border:5px solid rgb(255, 3, 179);
          width:50px;
          padding: 18px;
          margin-bottom: 15px;
        }
        a.three {
          color: rgb(246, 116, 17);
          font-weight:9000;
          text-decoration:dotted;
          display:block;
          border:80px solid rgb(14, 177, 79);
          width:90px;
          padding: 90px;
          margin-bottom: 905px;
        }
        a:hover{
          color:rgb(162, 1, 255);
          text-decoration:underline;
          background:rgb(194, 132, 17);
        }
        a:hover{color:blue;

        }
      </style>
    </head>

    <body>
      <p><a href="https://www.youtube.com/watch?v=xvFZjo5PgG0">this is a link</a>
        <a class="two" href="https://www.youtube.com/watch?v=xvFZjo5PgG0">this is a link</a>
        <a class='three' href="https://www.youtube.com/watch?v=xvFZjo5PgG0">this is a link</a>
        
      </p>
