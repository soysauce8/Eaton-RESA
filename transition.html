<!DOCTYPE html>

<html lang="en">
  <html lang="en">

  <head>
  <meta charset="utf-8">
  <title>transition site</title>
  <style>
  #one{
    width:100px;
    height:100px;
    background:blue;
    border:2px solid red;
    transition:transform 1.5s,background 1s;
    margin-bottom: 50px;

  }
  #two{
    width:50px;
    height:50px;
    background:rgb(25, 212, 40);
    border:2px solid rgb(82, 79, 159);
    transition:width 100s;
    margin-bottom: 50px;
    border-radius:50px;

  }
  #three{ width:500px;
    height:500px;
    background:rgb(0, 0, 0);
    border:2px solid rgb(255, 255, 255);
    transition:transform 30s;
    margin-bottom: 50px;
    border-radius:50px;
    
  }
#four{
  width:1000px;
    height:1000px;
    background:rgb(222, 10, 10);
    border:10px solid rgb(0, 0, 0);
    transition:width 5s,height 5s,rotate 5s, border-radius 5s;
    margin-bottom: 50px;
    border-radius:50px;

}

  #one:hover{
    transform:rotate(2000000deg)scale(3);background:green;
  }
  #two:hover{
    width:20000px;
  }
  #three:hover{
    transform:scale(3);
  }
  #four:hover{
    width:200px;
    height:200px;
    rotate:80deg;
    border-radius:50%;
  }
  </style>
  </head>
              
  <body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
  </body>
  
  </html>
